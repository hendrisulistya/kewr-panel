<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Monitor Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/sse.js"></script>
  </head>
  <body class="bg-gray-100">
    <div class="flex h-screen">
      <!-- Sidebar -->
      <div class="w-64 bg-white shadow-lg">
        <div class="p-4 border-b border-gray-200">
          <h1 class="text-xl font-bold text-gray-800">System Panel</h1>
        </div>
        <nav class="mt-4">
          <a
            href="#system-section"
            class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 transition-colors"
          >
            <svg
              class="w-5 h-5 mr-3"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
              />
            </svg>
            System Monitor
          </a>
          <a
            href="#nodejs-section"
            class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 transition-colors"
          >
            <svg
              class="w-5 h-5 mr-3"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"
              />
            </svg>
            Node.js
          </a>
          <a
            href="#database-section"
            class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 transition-colors"
          >
            <svg
              class="w-5 h-5 mr-3"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 7v10c0 2 1 3 3 3h10c2 0 3-1 3-3V7c0-2-1-3-3-3H7c-2 0-3 1-3 3z"
              />
            </svg>
            Database
          </a>
          <a
            href="#pm2-section"
            class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 transition-colors"
          >
            <svg
              class="w-5 h-5 mr-3"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 10V3L4 14h7v7l9-11h-7z"
              />
            </svg>
            PM2
          </a>
        </nav>
      </div>

      <!-- Main Content -->
      <div class="flex-1 overflow-auto p-8">
        <div id="system-section">{% include "sections/system.html" %}</div>
        <div id="nodejs-section" class="mt-8">
          {% include "sections/nodejs.html" %}
        </div>
        <div id="database-section" class="mt-8">
          {% include "sections/database.html" %}
        </div>
        <div id="pm2-section" class="mt-8">
          {% include "sections/pm2.html" %}
        </div>
      </div>
    </div>

    <script>
      function updateStats() {
        fetch("/api/system/stats")
          .then((response) => response.json())
          .then((data) => {
            document.querySelector(".cpu-usage-value").textContent =
              data.cpu_usage.toFixed(1) + "%";
            document.querySelector(
              ".cpu-usage-circle"
            ).style.strokeDasharray = `${data.cpu_usage}, 100`;

            const memoryPercentage = (
              (data.memory_used * 100) /
              data.memory_total
            ).toFixed(1);
            document.querySelector(
              ".memory-usage-value"
            ).textContent = `${memoryPercentage}%`;
            document.querySelector(
              ".memory-usage-circle"
            ).style.strokeDasharray = `${memoryPercentage}, 100`;

            const diskPercentage = (
              (data.disk_used * 100) /
              data.disk_total
            ).toFixed(1);
            document.querySelector(
              ".disk-usage-value"
            ).textContent = `${diskPercentage}%`;
            document.querySelector(
              ".disk-usage-circle"
            ).style.strokeDasharray = `${diskPercentage}, 100`;
          });
      }

      // Update stats every 5 seconds
      setInterval(updateStats, 5000);
      // Initial update
      updateStats();
    </script>
  </body>
</html>
