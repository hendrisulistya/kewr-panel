[package]
name = "panel"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.3.1"
actix-files = "0.6.2"
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.29.0"
log = "0.4"
env_logger = "0.10"
tera = "1.19.0"
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
thiserror = "1.0"
anyhow = "1.0"
ctrlc = "3.4"
config = "0.13"
tokio-stream = "0.1.17"
dotenv = "0.15.0"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.11"
serial_test = "2.0"
rstest = "0.18"
fake = "2.6"
test-log = "0.2"
wiremock = "0.5"
actix-rt = "2.8"
